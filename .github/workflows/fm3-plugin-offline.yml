name: FM3 plugin offline
on:
  push:
    paths: ['plugins/fm3-sound-architect-2/**', 'tools/fm3/**', 'docs/fm3/parameter-evidence/**', 'packages/fractal-midi/catalog/fm3.json', 'packages/fractal-midi/src/gen3/fm3/**', 'packages/fractal-midi/docs/research/primitives/_negative/gen3-paramid-reuse-across-model-bytes.md', '.github/workflows/fm3-plugin-offline.yml', '.github/workflows/native-matrix.yml']
  pull_request:
    paths: ['plugins/fm3-sound-architect-2/**', 'tools/fm3/**', 'docs/fm3/parameter-evidence/**', 'packages/fractal-midi/catalog/fm3.json', 'packages/fractal-midi/src/gen3/fm3/**', 'packages/fractal-midi/docs/research/primitives/_negative/gen3-paramid-reuse-across-model-bytes.md', '.github/workflows/fm3-plugin-offline.yml', '.github/workflows/native-matrix.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify parameter evidence and coverage freshness
        run: |
          python3 tools/fm3/test-parameter-evidence.py
          python3 tools/fm3/test-six-field-resolution.py
          python3 tools/fm3/six_field_resolution.py
          python3 tools/fm3/test-type-applicability.py
          python3 tools/fm3/type_applicability.py
          python3 tools/fm3/test-parameter-dependencies.py
          python3 tools/fm3/parameter_dependencies.py
          python3 tools/fm3/test-delay-reverb-applicability.py
          python3 tools/fm3/delay_reverb_applicability.py
          python3 tools/fm3/test-modulation-dynamics-applicability.py
          python3 tools/fm3/modulation_dynamics_applicability.py
          python3 tools/fm3/test-pitch-word-codecs.py
          python3 tools/fm3/test-pitch-display.py
          python3 tools/fm3/pitch_display.py
          python3 tools/fm3/test-pitch-custom-scales.py
          python3 tools/fm3/pitch_custom_scales.py
          python3 tools/fm3/global_scale_wire.py
          python3 tools/fm3/pitch_word_codecs.py
          python3 tools/fm3/test-rotary-pitch-applicability.py
          python3 tools/fm3/rotary_pitch_applicability.py
          node --test tools/fm3/test-modifier-damping.mjs
          node --test tools/fm3/test-modifier-min.mjs
          node --test tools/fm3/test-modifier-batch.mjs
          python3 tools/fm3/modifier_quantization_audit.py
          python3 tools/fm3/test-modifier-value-path.py
          python3 tools/fm3/test-modifier-sharc.py
          node tools/fm3/modifier_slot_readiness.mjs
          node tools/fm3/modifier-corpus-audit.mjs
          python3 tools/fm3/point4-evidence.py
          python3 tools/fm3/point6_native_bindings.py
          python3 tools/fm3/insert_applicability.py
          python3 tools/fm3/test-insert-applicability.py
          node tools/fm3/point6-evidence.mjs
          node tools/fm3/point2-evidence.mjs
          python3 tools/fm3/input_volume_evidence.py
          node tools/fm3/volume-device-evidence.mjs
          node tools/fm3/input-volume-audit.mjs
          node tools/fm3/test-input-volume-comparison.mjs
          python3 tools/fm3/parameter-evidence.py
          python3 tools/fm3/metadata_reconciliation.py
          node tools/fm3/encoder-matrix.mjs
          python3 tools/fm3/point3-index.py
          node tools/fm3/point3-evidence.mjs
          node tools/fm3/point5-evidence.mjs
          node tools/fm3/grid-check-ingest.mjs
          node tools/fm3/read-value-ingest.mjs
          node tools/fm3/pedal-check-ingest.mjs
          node tools/fm3/scene-midi-ingest.mjs
          node tools/fm3/scene-midi-listen-ingest.mjs
          python3 -B tools/fm3/test-scene-midi-listen.py
          node tools/fm3/test-read-requests.mjs
          node tools/fm3/test-label-sweep-collector.mjs
          node tools/fm3/label-sweep-ingest.mjs
          node tools/fm3/bit4-check-ingest.mjs
          node tools/fm3/step-diff-ingest.mjs
          node tools/fm3/auto-swell-verify-ingest.mjs
          python3 -B tools/fm3/test-step-diff.py
          python3 -B tools/fm3/test-bit4-check.py
          python3 -B tools/fm3/test-scene-midi-din.py
          node tools/fm3/scene-midi-din-ingest.mjs
          node tools/fm3/cpu-check-ingest.mjs
          node tools/fm3/label-boundary-ingest.mjs
          node tools/fm3/cpu-scenes-ingest.mjs
          python3 -B tools/fm3/test-cpu-scenes.py
          node tools/fm3/pedal-store-ingest.mjs
          node tools/fm3/bind-store-ingest.mjs
          node tools/fm3/mod-display-ingest.mjs
          node tools/fm3/cpu-t8-ingest.mjs
          node tools/fm3/volume-range-ingest.mjs
          python3 -B plugins/fm3-sound-architect-2/skills/fm3-sound-architect-2/engine/skills/instructions/scripts/cpu-sweep-collector/FM3_BIND_STORE.py --self-test
          python3 -B plugins/fm3-sound-architect-2/skills/fm3-sound-architect-2/engine/skills/instructions/scripts/cpu-sweep-collector/FM3_MOD_READ.py --self-test
          python3 -B plugins/fm3-sound-architect-2/skills/fm3-sound-architect-2/engine/skills/instructions/scripts/cpu-sweep-collector/FM3_CPU_STEPS.py --self-test
          python3 -B tools/fm3/test-cpu-check-build.py
          node tools/fm3/cpu-sweep-ingest.mjs plugins/fm3-sound-architect-2/skills/fm3-sound-architect-2/engine/skills/instructions/references/fm3-cpu-sweep-20261023-results.jsonl
      - name: Replay the pinned 0.3.11 remaining-modifier audit
        run: |
          git fetch --no-tags origin f0a99bc190fcbe3a63284335c68fad66e9f9a36c 194833788d15db09d5ab9a774940ae84fcdebaad
          python3 tools/fm3/modifier_remaining_audit.py
      - name: Verify bounded hardware Min/Max evidence and failure cases
        run: |
          python3 tools/fm3/test-modifier-hw-replay.py
          python3 tools/fm3/test-modifier-minmax-hw-candidate.py
          node --test tools/fm3/test-modifier-hw-candidate-syxdiff.mjs
      - name: Run the required offline suite
        run: python3 tools/fm3/test-offline.py --output "$RUNNER_TEMP/fm3-tests"
      - name: Verify Volume pedal research readers and static collector failure handling
        run: |
          node --test tools/fm3/test-volume-pedal-legacy.mjs
          node --test tools/fm3/rea-volume-pedal/test-volume-pedal-batch.mjs
          node --test tools/fm3/rea-volume-pedal/test-binding.mjs
          bash -n tools/fm3/rea-volume-pedal/FM3_REA_VOLUME_PEDAL.command
      - name: Build the tested commit
        run: python3 tools/fm3/build-release.py --commit HEAD --tests "$RUNNER_TEMP/fm3-tests/summary.json" --output "$RUNNER_TEMP/fm3-release"
      - name: Verify the unpacked package
        run: |
          FM3_PACKAGE_VERSION="$(node -p "require('./plugins/fm3-sound-architect-2/plugin.json').version")"
          tar -xzf "$RUNNER_TEMP/fm3-release/fm3-sound-architect-2-$FM3_PACKAGE_VERSION.tar.gz" -C "$RUNNER_TEMP/fm3-release"
          python3 "$RUNNER_TEMP/fm3-release/fm3-sound-architect-2/skills/fm3-sound-architect-2/engine/skills/instructions/scripts/fm3-session-archive.py" verify
          python3 "$RUNNER_TEMP/fm3-release/fm3-sound-architect-2/skills/fm3-sound-architect-2/engine/skills/instructions/scripts/fm3-session-archive.py" prepare --output "$RUNNER_TEMP/fm3-runtime"
          node "$RUNNER_TEMP/fm3-runtime/skills/fm3-sound-architect-2/engine/skills/instructions/scripts/fm3-self-check.mjs" "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fm3-offline-${{ github.sha }}
          path: |
            ${{ runner.temp }}/fm3-tests
            ${{ runner.temp }}/fm3-release
