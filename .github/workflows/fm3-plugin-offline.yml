name: FM3 plugin offline
on:
  push:
    paths: ['plugins/fm3-sound-architect-2/**', 'tools/fm3/**', 'docs/fm3/parameter-evidence/**', 'packages/fractal-midi/catalog/fm3.json', 'packages/fractal-midi/src/gen3/fm3/**', 'packages/fractal-midi/docs/research/primitives/_negative/gen3-paramid-reuse-across-model-bytes.md', '.github/workflows/fm3-plugin-offline.yml']
  pull_request:
    paths: ['plugins/fm3-sound-architect-2/**', 'tools/fm3/**', 'docs/fm3/parameter-evidence/**', 'packages/fractal-midi/catalog/fm3.json', 'packages/fractal-midi/src/gen3/fm3/**', 'packages/fractal-midi/docs/research/primitives/_negative/gen3-paramid-reuse-across-model-bytes.md', '.github/workflows/fm3-plugin-offline.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify parameter evidence and coverage freshness
        run: |
          python3 tools/fm3/test-parameter-evidence.py
          python3 tools/fm3/test-six-field-resolution.py
          python3 tools/fm3/six_field_resolution.py
          python3 tools/fm3/test-type-applicability.py
          python3 tools/fm3/type_applicability.py
          python3 tools/fm3/test-parameter-dependencies.py
          python3 tools/fm3/parameter_dependencies.py
          python3 tools/fm3/test-delay-reverb-applicability.py
          python3 tools/fm3/delay_reverb_applicability.py
          python3 tools/fm3/test-modulation-dynamics-applicability.py
          python3 tools/fm3/modulation_dynamics_applicability.py
          python3 tools/fm3/test-pitch-word-codecs.py
          python3 tools/fm3/pitch_word_codecs.py
          python3 tools/fm3/test-rotary-pitch-applicability.py
          python3 tools/fm3/rotary_pitch_applicability.py
          python3 tools/fm3/parameter-evidence.py
          python3 tools/fm3/metadata_reconciliation.py
          node tools/fm3/encoder-matrix.mjs
      - name: Run the required offline suite
        run: python3 tools/fm3/test-offline.py --output "$RUNNER_TEMP/fm3-tests"
      - name: Build the tested commit
        run: python3 tools/fm3/build-release.py --commit HEAD --tests "$RUNNER_TEMP/fm3-tests/summary.json" --output "$RUNNER_TEMP/fm3-release"
      - name: Verify the unpacked package
        run: |
          FM3_PACKAGE_VERSION="$(node -p "require('./plugins/fm3-sound-architect-2/plugin.json').version")"
          tar -xzf "$RUNNER_TEMP/fm3-release/fm3-sound-architect-2-$FM3_PACKAGE_VERSION.tar.gz" -C "$RUNNER_TEMP/fm3-release"
          node "$RUNNER_TEMP/fm3-release/fm3-sound-architect-2/skills/fm3-sound-architect-2/engine/skills/instructions/scripts/fm3-self-check.mjs" "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fm3-offline-${{ github.sha }}
          path: |
            ${{ runner.temp }}/fm3-tests
            ${{ runner.temp }}/fm3-release
